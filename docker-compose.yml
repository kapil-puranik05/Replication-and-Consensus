services:
  gateway:
    build:
      context: ./middleware
    command:
      - "--server.port=9000"
    ports:
      - "9000:9000"

  node1:
    build:
      context: ./raft
    command:
      - "--server.port=8080"
      - "--raft.data-dir=configs/node1"
    ports:
      - "8080:8080"
    volumes:
      - ./raft/configs/node1:/app/configs/node1
    depends_on:
      - gateway

  node2:
    build:
      context: ./raft
    command:
      - "--server.port=8081"
      - "--raft.data-dir=configs/node2"
    ports:
      - "8081:8081"
    volumes:
      - ./raft/configs/node2:/app/configs/node2
    depends_on:
      - gateway

  node3:
    build:
      context: ./raft
    command:
      - "--server.port=8082"
      - "--raft.data-dir=configs/node3"
    ports:
      - "8082:8082"
    volumes:
      - ./raft/configs/node3:/app/configs/node3
    depends_on:
      - gateway